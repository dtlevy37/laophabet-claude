[build]
  # No framework. The only build step writes config.js from environment variables.
  command = "printf \"export const SUPABASE_URL = '%s'\\nexport const SUPABASE_ANON_KEY = '%s'\\n\" \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > config.js"
  publish = "."

# The recorder needs the microphone.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
