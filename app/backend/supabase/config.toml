# Minimal Supabase CLI config. Run `supabase init` elsewhere if you want the
# full commented template; unspecified keys use CLI defaults.
project_id = "laophabet-native"

[db]
major_version = 15

[db.seed]
enabled = true
# Order matters (dependencies first). Initial import only; regenerate with
# `python approved-scripts/db_sql.py seed` from the project root.
sql_paths = [
  "./seeds/01_templates.sql",
  "./seeds/02_words.sql",
  "./seeds/03_letters.sql",
  "./seeds/04_vowels.sql",
  "./seeds/05_sentences.sql",
  "./seeds/06_sentence_words.sql",
  "./seeds/07_template_fillers.sql",
  "./seeds/08_tone_exceptions.sql",
  "./seeds/09_learning_order.sql",
]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false